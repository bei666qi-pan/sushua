[project]
name = "sushua-document-service-core"
version = "0.1.1"
description = "Shared object-reference contracts and storage adapters for SuShua document services"
requires-python = ">=3.11,<3.15"
dependencies = [
  "boto3==1.43.85",
  "pydantic==2.13.5",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sushua_document_service"]
