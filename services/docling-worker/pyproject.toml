[project]
name = "sushua-docling-worker"
version = "0.1.0"
description = "Isolated Docling runtime for SuShua document conversion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.124.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
